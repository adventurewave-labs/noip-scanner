# cluster-admin bound to the default ServiceAccount -> NOIP-RBAC-002 (CIS-5.1.1, CIS-5.1.5)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: noip-test-default-sa-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: default
    namespace: noip-test-bad

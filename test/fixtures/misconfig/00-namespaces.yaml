# Seeded misconfiguration for the kind golden test (PRD R-4).
# noip-test-bad: deliberately has NO NetworkPolicy  -> NOIP-NET-001 / CIS-5.3.2
#                and no Pod Security Admission label -> NOIP-NS-001
# noip-test-clean: control case; must produce zero findings. PSA enforces `restricted` for real on kind,
#                  so its pods are also proven admissible under the restricted profile.
apiVersion: v1
kind: Namespace
metadata:
  name: noip-test-bad
---
apiVersion: v1
kind: Namespace
metadata:
  name: noip-test-clean
  labels:
    pod-security.kubernetes.io/enforce: restricted

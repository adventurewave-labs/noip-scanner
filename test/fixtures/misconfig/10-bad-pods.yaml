# Each pod is hardened except for the ONE seeded flaw, so the golden mapping stays exact.
# privileged: true  -> NOIP-POD-001 (CIS-5.2.1). The API rejects privileged with allowPrivilegeEscalation=false,
#                      so this pod necessarily also yields NOIP-POD-005 (CIS-5.2.5).
apiVersion: v1
kind: Pod
metadata:
  name: privileged
  namespace: noip-test-bad
spec:
  automountServiceAccountToken: false
  securityContext: { runAsNonRoot: true, runAsUser: 65534, seccompProfile: { type: RuntimeDefault } }
  containers:
    - name: app
      image: registry.k8s.io/pause:3.10
      securityContext: { privileged: true, readOnlyRootFilesystem: true }
      resources: { limits: { cpu: 50m, memory: 32Mi } }
---
# hostPID: true -> NOIP-POD-002 (CIS-5.2.2)
apiVersion: v1
kind: Pod
metadata:
  name: hostpid
  namespace: noip-test-bad
spec:
  hostPID: true
  automountServiceAccountToken: false
  securityContext: { runAsNonRoot: true, runAsUser: 65534, seccompProfile: { type: RuntimeDefault } }
  containers:
    - name: app
      image: registry.k8s.io/pause:3.10
      securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
      resources: { limits: { cpu: 50m, memory: 32Mi } }
---
# secret as env var -> NOIP-POD-009 (CIS-5.4.1)
apiVersion: v1
kind: Secret
metadata:
  name: db-creds
  namespace: noip-test-bad
type: Opaque
stringData:
  password: noip-seeded-secret-value-7f3a
---
apiVersion: v1
kind: Pod
metadata:
  name: secret-env
  namespace: noip-test-bad
spec:
  automountServiceAccountToken: false
  securityContext: { runAsNonRoot: true, runAsUser: 65534, seccompProfile: { type: RuntimeDefault } }
  containers:
    - name: app
      image: registry.k8s.io/pause:3.10
      env:
        - name: DB_PASSWORD
          valueFrom: { secretKeyRef: { name: db-creds, key: password } }
      securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
      resources: { limits: { cpu: 50m, memory: 32Mi } }
